<!doctype html>
<html lang="ko">
<head>
  <link rel="icon" href="../../assets/img/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../../assets/img/favicon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../../assets/img/apple-touch-icon.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Metabolomics를 측정·전처리·식별·해석의 질문으로 탐색하는 HaLab Wiki">
  <title>Metabolomics · HaLab Wiki</title>
  <style>
    :root {
      --ink: #18211b;
      --muted: #667168;
      --paper: #f7f7f2;
      --surface: #ffffff;
      --line: #d8ddd7;
      --green: #1f5d43;
      --green-soft: #e7f0ea;
      --blue: #315d78;
      --rust: #94553b;
      --gold: #936f21;
      --shadow: 0 14px 35px rgba(24, 33, 27, .07);
      --radius: 10px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: "Pretendard", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
    }
    button, input { font: inherit; }
    a { color: inherit; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(247, 247, 242, .94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }
    .topbar-inner {
      width: min(1180px, calc(100% - 40px));
      min-height: 64px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .brand {
      border: 0;
      background: none;
      padding: 0;
      color: var(--ink);
      cursor: pointer;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.18rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .brand span { color: var(--green); }
    .brand-group { display: flex; align-items: center; white-space: nowrap; }
    .brand-home { text-decoration: none; }
    .brand-domain { margin-left: 6px; text-decoration: none; }
    .top-search {
      flex: 1;
      max-width: 560px;
      margin-left: auto;
      position: relative;
    }
    .top-search input {
      width: 100%;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      padding: 0 44px 0 14px;
      color: var(--ink);
      outline: none;
    }
    .top-search input:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
    .keycap {
      position: absolute;
      right: 10px;
      top: 9px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--muted);
      background: var(--paper);
      padding: 1px 6px;
      font-size: .75rem;
    }

    main { min-height: calc(100vh - 140px); }
    .container { width: min(1120px, calc(100% - 40px)); margin: 0 auto; }

    .hero {
      padding: 78px 0 52px;
      text-align: center;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(rgba(31, 93, 67, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(31, 93, 67, .035) 1px, transparent 1px);
      background-size: 34px 34px;
    }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--green);
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    h1, h2, h3 { font-family: Georgia, "Noto Serif KR", serif; line-height: 1.25; }
    .hero h1 { margin: 0; font-size: clamp(2.5rem, 6vw, 5rem); letter-spacing: -.045em; }
    .hero-copy { margin: 16px auto 26px; max-width: 650px; color: var(--muted); font-size: 1.04rem; }
    .hero-search { width: min(720px, calc(100% - 32px)); margin: 0 auto; position: relative; }
    .hero-search input {
      width: 100%;
      height: 62px;
      border: 1px solid #bac6bd;
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
      padding: 0 58px 0 20px;
      color: var(--ink);
      font-size: 1.03rem;
      outline: none;
    }
    .hero-search input:focus { border-color: var(--green); box-shadow: 0 0 0 4px var(--green-soft), var(--shadow); }
    .search-icon { position: absolute; right: 20px; top: 18px; color: var(--green); font-size: 1.3rem; }
    .search-hint { margin: 11px 0 0; color: var(--muted); font-size: .82rem; }

    .browse { padding: 58px 0 76px; }
    .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
    .section-heading h2 { margin: 0; font-size: 1.65rem; }
    .section-heading p { margin: 0; color: var(--muted); font-size: .9rem; }
    .category-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .category-card {
      position: relative;
      min-height: 235px;
      border: 1px solid var(--line);
      border-top: 4px solid var(--accent);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 26px;
      text-align: left;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .category-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
    .category-card:focus-visible { outline: 3px solid var(--green-soft); outline-offset: 2px; }
    .category-number { color: var(--accent); font-family: Georgia, serif; font-size: .95rem; font-weight: 700; }
    .category-card h3 { margin: 12px 0 10px; font-size: 1.65rem; }
    .category-card p { margin: 0 0 25px; max-width: 520px; color: var(--muted); }
    .card-route { position: absolute; left: 26px; bottom: 23px; color: var(--accent); font-size: .86rem; font-weight: 750; }

    .breadcrumb { padding: 30px 0 18px; color: var(--muted); font-size: .84rem; }
    .breadcrumb button { border: 0; padding: 0; background: none; color: var(--green); cursor: pointer; }
    .breadcrumb span { margin: 0 8px; color: #9ca49e; }
    .page-header { padding: 18px 0 36px; border-bottom: 1px solid var(--line); }
    .page-header h1 { margin: 7px 0 12px; font-size: clamp(2.2rem, 5vw, 4rem); letter-spacing: -.035em; }
    .page-header .lead { margin: 0; max-width: 740px; color: var(--muted); font-size: 1.04rem; }
    .question-list { padding: 42px 0 72px; display: grid; gap: 16px; }
    .question-block { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: visible; }
    .question-head { padding: 22px 24px 18px; border-bottom: 1px solid var(--line); }
    .question-head small { color: var(--green); font-weight: 800; }
    .question-head h2 { margin: 5px 0 7px; font-size: 1.35rem; }
    .question-head p { margin: 0; color: var(--muted); font-size: .92rem; }
    .concept-row { display: grid; grid-template-columns: 1.2fr 2fr auto; align-items: center; gap: 18px; padding: 17px 24px; border-top: 1px solid #edf0ec; }
    .concept-row:first-child { border-top: 0; }
    .concept-row strong { font-size: .95rem; }
    .concept-row p { margin: 0; color: var(--muted); font-size: .86rem; }
    .concept-row button { border: 0; background: none; color: var(--green); font-weight: 750; cursor: pointer; padding: 5px; }
    .concept-row .map-label { color: #8b948d; font-size: .78rem; white-space: nowrap; }

    .search-page { padding-bottom: 72px; }
    .search-summary { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin: 10px 0 22px; }
    .search-summary p { margin: 0; color: var(--muted); }
    .filters { display: flex; flex-wrap: wrap; gap: 7px; }
    .filter-btn { border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 6px 12px; color: var(--muted); cursor: pointer; font-size: .8rem; }
    .filter-btn.active { border-color: var(--green); background: var(--green-soft); color: var(--green); font-weight: 750; }
    .results { display: grid; gap: 12px; }
    .result-card { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 20px 22px; cursor: pointer; text-align: left; }
    .result-card:hover { border-color: #93aa9a; box-shadow: 0 7px 20px rgba(24, 33, 27, .05); }
    .result-path { color: var(--green); font-size: .76rem; font-weight: 750; }
    .result-card h2 { margin: 4px 0 6px; font-size: 1.25rem; }
    .result-card p { margin: 0; color: var(--muted); font-size: .9rem; }
    mark { background: #fff0ad; color: inherit; padding: 0 2px; }
    .empty { border: 1px dashed #b8c0ba; border-radius: var(--radius); padding: 48px 24px; text-align: center; color: var(--muted); }

    .article-layout { display: grid; grid-template-columns: minmax(0, 740px) 260px; gap: 64px; padding: 12px 0 80px; align-items: start; }
    .article { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: clamp(25px, 5vw, 52px); }
    .article h1 { margin: 6px 0 5px; font-size: clamp(2.1rem, 5vw, 3.5rem); letter-spacing: -.03em; }
    .aliases { margin: 0 0 26px; color: var(--muted); font-size: .83rem; }
    .definition { margin: 0 0 34px; padding: 18px 20px; border-left: 4px solid var(--green); background: var(--green-soft); font-size: 1.03rem; }
    .article h2 { margin: 34px 0 12px; padding-bottom: 7px; border-bottom: 1px solid var(--line); font-size: 1.32rem; }
    .article p { margin: 0 0 15px; }
    .article ul { margin: 0 0 18px; padding-left: 22px; }
    .article li { margin: 6px 0; }
    .fact-list {
      display: grid;
      gap: 9px;
      margin: 0 0 18px;
      padding-left: 20px;
      color: #37423a;
    }
    .fact-list li { padding-left: 4px; }
    .fact-list li::marker { color: var(--green); }
    .term-link { border: 0; border-bottom: 1px solid #8aa897; background: none; padding: 0; color: var(--green); cursor: pointer; font-weight: 700; }
    .glossary-term {
      position: relative;
      border-bottom: 1px dotted var(--green);
      color: #174b37;
      cursor: help;
      outline: none;
    }
    .glossary-term::after {
      content: attr(data-definition);
      position: absolute;
      z-index: 40;
      left: 0;
      bottom: calc(100% + 8px);
      width: max-content;
      max-width: min(320px, calc(100vw - 40px));
      padding: 10px 12px;
      border-radius: 7px;
      background: #17221b;
      color: #f8faf8;
      box-shadow: 0 10px 28px rgba(10, 20, 14, .24);
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
      font-size: .78rem;
      font-weight: 500;
      line-height: 1.55;
      letter-spacing: 0;
      white-space: normal;
      opacity: 0;
      visibility: hidden;
      transform: translateY(4px);
      transition: opacity .14s ease, transform .14s ease, visibility .14s ease;
      pointer-events: none;
    }
    .glossary-term:hover::after,
    .glossary-term:focus::after {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    .glossary-term:focus { border-bottom-style: solid; }
    .tooltip-hint {
      margin: -15px 0 25px;
      color: var(--muted);
      font-size: .76rem;
    }
    .aside { position: sticky; top: 88px; }
    .aside-box { border-top: 3px solid var(--green); background: var(--surface); padding: 18px; box-shadow: 0 8px 24px rgba(24,33,27,.05); }
    .aside-box h3 { margin: 0 0 12px; font-size: 1rem; }
    .related-list { display: grid; gap: 9px; }
    .related-list button { border: 0; background: none; padding: 0; text-align: left; color: var(--green); cursor: pointer; font-size: .87rem; }
    .source-box { margin-top: 16px; border-top-color: var(--blue); }
    .source-list { display: grid; gap: 9px; }
    .source-list a { color: var(--blue); font-size: .84rem; text-decoration: none; }
    .source-list a:hover { text-decoration: underline; }
    .policy-note { margin-top: 18px; padding: 14px 16px; border: 1px solid var(--line); color: var(--muted); font-size: .78rem; }

    footer { border-top: 1px solid var(--line); padding: 24px 0 34px; color: var(--muted); font-size: .78rem; }
    footer .container { display: flex; justify-content: space-between; gap: 20px; }

    @media (max-width: 820px) {
      .topbar-inner { width: min(100% - 24px, 1180px); gap: 12px; }
      .brand { font-size: 1rem; }
      .keycap { display: none; }
      .container { width: min(100% - 28px, 1120px); }
      .hero { padding-top: 54px; }
      .category-grid { grid-template-columns: 1fr; }
      .category-card { min-height: 215px; }
      .concept-row { grid-template-columns: 1fr auto; }
      .concept-row p { grid-column: 1 / -1; grid-row: 2; }
      .article-layout { grid-template-columns: 1fr; gap: 20px; }
      .aside { position: static; }
      .search-summary { align-items: flex-start; flex-direction: column; }
    }
    @media (max-width: 520px) {
      .topbar-inner { min-height: 58px; }
      .brand-domain { display: none; }
      .top-search input { height: 38px; }
      .hero h1 { font-size: 2.55rem; }
      .hero-search input { height: 56px; }
      .section-heading { align-items: flex-start; flex-direction: column; gap: 5px; }
      .category-card { padding: 21px; }
      .card-route { left: 21px; }
      .question-head, .concept-row { padding-left: 18px; padding-right: 18px; }
      .article { border-left: 0; border-right: 0; border-radius: 0; margin-left: -14px; margin-right: -14px; }
      footer .container { flex-direction: column; }
    }
  </style>
</head>
<body>

      <div class="brand-group"><a class="brand brand-home" href="../../index.html">HaLab Wiki</a><a class="brand brand-domain" href="../index.html"><span>/ Omics</span></a><button class="brand brand-domain" type="button" data-route="home"><span>/ Metabolomics</span></button></div>
      <form class="top-search" id="topSearchForm" role="search">
        <input id="topSearch" type="search" aria-label="위키 검색" placeholder="Search term / acronym">

      </form>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer>
    <div class="container"><span>Updated 2026-06-24</span></div>
  </footer>

  <script>
    const sections = {
      "platform":{"number":"01","title":"Measurement Platforms","english":"WHAT PRODUCES THE SIGNAL","accent":"#8b4f3a","summary":"Metabolome · NMR · MS · Targeted · Untargeted","groups":[
        {"q":"Metabolomics는 무엇을 측정하는가?","note":"Small molecules as functional readout","items":[["metabolome","Metabolome & metabolomics","Small-molecule metabolite layer를 동시에 측정"],["functional-readout","Functional readout","유전·식이·환경·microbiome 효과가 모인 현재 상태를 읽음"]]},
        {"q":"NMR과 MS는 무엇이 다른가?","note":"Reproducibility vs coverage","items":[["nmr-ms","NMR vs MS","NMR은 정량 재현성, MS는 sensitivity와 coverage에 강점"],["targeted-untargeted","Targeted vs untargeted","정해진 metabolite 정량인지 넓은 feature discovery인지 구분"]]}
      ]},
      "preprocessing":{"number":"02","title":"Preprocessing & Feature Table","english":"FROM RAW SPECTRA TO FEATURES","accent":"#526b7a","summary":"Peak detection · Alignment · Deconvolution · Feature table · QC","groups":[
        {"q":"Raw spectrum은 어떤 table이 되는가?","note":"m/z × retention time × intensity","items":[["feature-table","Feature table","m/z와 retention time으로 정의한 feature intensity matrix"],["peak-alignment","Peak detection & alignment","Sample 사이 peak와 retention time을 맞춰 비교 가능한 matrix 생성"]]},
        {"q":"LC-MS preprocessing에는 어떤 tool을 쓰는가?","note":"XCMS and MS-DIAL","items":[["xcms","XCMS","LC/MS feature detection과 retention-time alignment"],["ms-dial","MS-DIAL","DIA/DDA MS/MS deconvolution과 lipidomics workflow"]]}
      ]},
      "annotation":{"number":"03","title":"Annotation & Databases","english":"WHAT IS THIS FEATURE","accent":"#6f6948","summary":"m/z · MS/MS · METLIN · HMDB · GNPS · SIRIUS · MSI level","groups":[
        {"q":"Feature는 곧 metabolite인가?","note":"Feature identity is inferred","items":[["metabolite-annotation","Metabolite annotation","m/z × RT feature에 chemical identity를 부여"],["confidence-level","MSI confidence level","Standard·spectrum·class·unknown처럼 식별 신뢰도 구분"]]},
        {"q":"식별은 어떤 reference와 계산으로 보강하는가?","note":"Library matching and in silico inference","items":[["spectral-libraries","Spectral libraries","METLIN·HMDB·GNPS·LIPID MAPS 같은 reference와 비교"],["sirius","SIRIUS & CSI:FingerID","Isotope pattern과 fragmentation tree로 formula와 structure 후보 추론"]]}

        {"q":"대사체 결과는 pathway로 어떻게 읽는가?","note":"Identified metabolites or m/z features","items":[["metaboanalyst","MetaboAnalyst","통계·enrichment·pathway analysis를 묶은 web platform"],["mummichog","mummichog","식별 없이 m/z feature에서 pathway activity를 추론"],["activity-metabolomics","Activity metabolomics","대사체를 biomarker뿐 아니라 active driver 후보로 해석"]]}
      ]}
    };

    const articles = {
      "metabolome":{"title":"Metabolome & metabolomics","aliases":["metabolomics","metabonomics","small molecules"],"section":"platform","summary":"Cell·tissue·biofluid에 존재하는 small-molecule metabolite layer와 이를 동시에 측정하는 omics","body":[["핵심",["Metabolite는 gene·transcript·protein activity의 downstream functional readout으로 자주 해석됩니다.","Signal은 host metabolism뿐 아니라 microbiome, diet, drug, environment의 영향을 함께 반영할 수 있습니다.","현재 상태에 민감하기 때문에 sampling, storage, batch 기록이 중요합니다."]],["해석",["Detected metabolite는 assay가 관측한 chemical signal입니다.","Not detected는 biological absence와 동일하지 않습니다.","Platform coverage와 annotation confidence를 같이 확인합니다."]]],"related":["nmr-ms","metabolite-annotation","statistical-analysis"]},
      "functional-readout":{"title":"Functional readout","aliases":["phenotype readout","downstream readout"],"section":"platform","summary":"Metabolomics는 phenotype에 가까운 현재 metabolic state를 읽는 층으로 사용됩니다.","body":[["의미",["Transcriptome이나 proteome의 변화가 실제 biochemical state와 항상 일치하지는 않습니다.","Metabolite는 pathway의 substrate, product, cofactor로 작동해 biological state를 민감하게 반영합니다."]],["주의",["Association이 곧 causality는 아닙니다.","Mechanism 질문은 targeted validation, activity screen, mQTL/MR 같은 추가 evidence와 연결해 읽습니다."]]],"related":["activity-metabolomics","targeted-untargeted"]},
      "nmr-ms":{"title":"NMR vs MS","aliases":["NMR","mass spectrometry","LC-MS","GC-MS"],"section":"platform","summary":"NMR은 정량 재현성과 throughput, MS는 sensitivity와 feature coverage에 강점이 있어 서로 보완적입니다.","body":[["NMR",["비파괴적이고 sample preparation이 비교적 단순합니다.","정량 재현성이 좋아 large biobank biomarker panel에 적합합니다.","검출 가능한 metabolite 수는 MS보다 적은 편입니다."]],["MS",["LC 또는 GC separation 뒤 mass spectrometry로 ion signal을 측정합니다.","민감도와 dynamic range가 높아 untargeted discovery에 많이 쓰입니다.","Matrix effect와 annotation bottleneck을 함께 관리해야 합니다."]]],"related":["targeted-untargeted","feature-table"]},
      "targeted-untargeted":{"title":"Targeted vs untargeted","aliases":["targeted metabolomics","untargeted metabolomics","global metabolomics"],"section":"platform","summary":"Targeted는 미리 정한 metabolite를 정량하고, untargeted는 가능한 넓게 feature를 탐색합니다.","body":[["Targeted",["Known metabolites를 높은 선택성과 정량성으로 측정합니다.","Candidate validation이나 clinical panel에 적합합니다.","Standard curve와 internal standard 설계가 중요합니다."]],["Untargeted",["사전 지식 없이 넓은 chemical feature space를 탐색합니다.","Discovery에 강하지만 feature annotation이 별도 병목이 됩니다.","후속 targeted validation과 함께 읽는 것이 좋습니다."]]],"related":["metabolite-annotation","feature-table"]},
      "feature-table":{"title":"Feature table","aliases":["m/z RT feature","peak table","intensity matrix"],"section":"preprocessing","summary":"Sample별 m/z × retention time feature intensity를 정리한 metabolomics 분석의 기본 matrix","body":[["구조",["Row는 spectral feature, column은 sample입니다.","Feature ID는 보통 m/z와 retention time 조합으로 정의됩니다.","Annotation table과 sample metadata를 분리해 보존합니다."]],["해석",["Feature는 compound identity가 아니라 measurement unit입니다.","Adduct, isotope, in-source fragment 때문에 한 compound가 여러 feature로 보일 수 있습니다.","Downstream 통계 전에 missingness, drift, batch pattern을 확인합니다."]]],"related":["peak-alignment","metabolite-annotation","statistical-analysis"]},

      "xcms":{"title":"XCMS","aliases":["XCMS Online","LC/MS preprocessing"],"section":"preprocessing","summary":"LC/MS untargeted metabolomics에서 peak detection, retention-time alignment, feature matching으로 feature table을 만드는 표준 도구","body":[["Input/Output",["Input은 LC/MS raw data 또는 mzML 같은 open format입니다.","Output은 aligned feature table입니다.","Downstream 통계와 annotation의 출발점이 됩니다."]],["사용 맥락",["Untargeted LC/MS discovery workflow에 잘 맞습니다.","Parameter와 batch design을 함께 기록해야 재현성이 높아집니다.","Feature는 compound identity가 아니므로 annotation step과 분리합니다."]]],"related":["peak-alignment","metabolite-annotation","metlin"]},
      "ms-dial":{"title":"MS-DIAL","aliases":["MSDIAL","DIA deconvolution","lipidomics"],"section":"preprocessing","summary":"LC-MS/MS data에서 peak spotting, MS/MS deconvolution, annotation, quantification을 수행하는 metabolomics/lipidomics workflow","body":[["특징",["DIA data에서 co-eluting fragment와 noise를 분리해 precursor-fragment link를 복원합니다.","DDA와 DIA data 모두를 다룰 수 있습니다.","Lipidomics workflow에서 자주 사용됩니다."]],["해석",["Coverage는 좋아질 수 있지만 deconvolution quality가 annotation confidence에 영향을 줍니다.","Library match와 confidence level을 함께 확인합니다."]]],"related":["peak-alignment","spectral-libraries","confidence-level"]},
      "metabolite-annotation":{"title":"Metabolite annotation","aliases":["compound identification","metabolite identification","chemical identity"],"section":"annotation","summary":"Untargeted MS feature에 가능한 chemical identity를 부여하는 작업","body":[["왜 어려운가",["같은 정확질량 m/z에 여러 candidate compound가 대응할 수 있습니다.","Library에 없는 compound는 spectrum matching만으로 식별하기 어렵습니다.","Adduct, isotope, in-source fragment가 feature-compound 관계를 복잡하게 만듭니다."]],["접근",["MS/MS spectral library matching을 먼저 확인합니다.","In silico formula/structure prediction으로 library 밖 후보를 보강합니다.","Report에는 annotation confidence level을 같이 남깁니다."]]],"related":["spectral-libraries","sirius","confidence-level"]},
      "confidence-level":{"title":"MSI confidence level","aliases":["identification level","annotation confidence","putative annotation"],"section":"annotation","summary":"Metabolite identification이 표준품 대조인지, spectrum 기반 추정인지, class 수준인지, unknown인지 구분해 보고하는 원칙","body":[["Level thinking",["Standard compound와 MS/MS·retention time까지 맞으면 가장 강한 identification입니다.","Spectrum library match는 putative annotation으로 읽습니다.","Mass 또는 class 정보만 있으면 biological interpretation 강도를 낮춰야 합니다."]],["왜 필요한가",["Pathway interpretation은 false annotation에 민감합니다.","동일 feature라도 confidence에 따라 downstream 결론의 무게가 달라집니다."]]],"related":["metabolite-annotation","spectral-libraries"]},

      "statistical-analysis":{"title":"Statistical analysis","aliases":["normalization","batch correction","differential metabolomics","FDR"],"section":"interpretation","summary":"Feature 또는 metabolite abundance가 condition, exposure, phenotype에 따라 달라지는지 평가하는 분석","body":[["Workflow",["Sample metadata와 batch/run order를 먼저 확인합니다.","Normalization과 scaling을 적용한 뒤 PCA 등으로 pattern을 봅니다.","Feature별 effect size, p-value, FDR을 함께 보고합니다."]],["해석",["Feature-level signal은 annotation confidence와 연결해 읽습니다.","Batch와 matrix effect가 biological group과 겹치지 않는지 확인합니다.","Fold change만으로 pathway activity를 단정하지 않습니다."]]],"related":["multivariate-qc","metaboanalyst","mummichog"]},
      "multivariate-qc":{"title":"PCA & multivariate QC","aliases":["PCA","PLS-DA","sample QC"],"section":"interpretation","summary":"Sample clustering, outlier, batch/run-order pattern을 빠르게 점검하는 multivariate view","body":[["사용",["Pooled QC와 blank가 예상 위치에 모이는지 봅니다.","Group separation이 batch, plate, run order와 겹치는지 확인합니다.","Loading feature는 annotation 전에는 chemical conclusion으로 과해석하지 않습니다."]],["주의",["PLS-DA 같은 supervised model은 overfitting 확인이 필요합니다.","Visualization은 test가 아니라 QC와 탐색의 시작점입니다."]]],"related":["statistical-analysis","feature-table"]},

    const sourceLinks = {};
    const officialSupplementLinks = {
      "xcms":[["XCMS Bioconductor package","https://bioconductor.org/packages/release/bioc/html/xcms.html"],["XCMS Online","https://xcmsonline.scripps.edu/"]],

      "metaboanalyst":[["MetaboAnalyst","https://www.metaboanalyst.ca/"]],
      "sirius":[["SIRIUS official site","https://bio.informatik.uni-jena.de/software/sirius/"]],

    };
    const glossaryTerms = {
      "metabolomics": { key: "metabolomics", definition: "Small-molecule metabolite layer를 large scale로 측정하는 omics." },
      "metabolome": { key: "metabolome", definition: "세포·조직·biofluid에 존재하는 small-molecule metabolite의 총체." },
      "feature": { key: "feature", definition: "m/z와 retention time 등으로 정의되는 측정 단위. 아직 metabolite identity는 아닐 수 있음." },
      "m/z": { key: "m/z", definition: "Ion mass-to-charge ratio. MS에서 feature를 구분하는 핵심 축." },
      "retention time": { key: "retention-time", definition: "Chromatography에서 compound가 column을 통과해 검출되는 시간." },
      "MS/MS": { key: "msms", definition: "Precursor ion을 fragment해 구조 정보를 얻는 tandem mass spectrometry." },
      "NMR": { key: "nmr", definition: "Nuclear magnetic resonance. 재현성 높은 metabolite measurement platform." },
      "MSI": { key: "msi", definition: "Metabolomics Standards Initiative. 식별 confidence와 보고 항목 표준." },
      "pathway": { key: "pathway", definition: "Metabolite와 enzyme reaction을 기능 단위로 묶은 metabolic process." },
      "FDR": { key: "fdr", definition: "Multiple testing에서 false discovery 비율을 제어하는 지표." }
    };
    const glossaryPattern = /(^|[^A-Za-z0-9])(retention time|mass spectrometry|metabolite annotation|feature table|targeted|untargeted|metabolomics|metabolome|MetaboAnalyst|mummichog|SIRIUS|METLIN|HMDB|GNPS|XCMS|MS-DIAL|MS\/MS|NMR|MSI|FDR|m\/z|feature|pathway)(?=$|[^A-Za-z0-9])/gi;
    function createAnnotator() {
      const seen = new Set();
      return function (text) {
        return esc(text).replace(glossaryPattern, function (match, prefix, term) {
          const item = glossaryTerms[term.toLowerCase()];
          if (!item || seen.has(item.key)) return match;
          seen.add(item.key);
          return prefix + '<span class="glossary-term" tabindex="0" data-definition="' + esc(item.definition) + '">' + esc(term) + '</span>';
        });
      };
    }

    const app = document.getElementById("app");
    const topSearch = document.getElementById("topSearch");
    let activeFilter = "all";

    function esc(value) {
      return String(value).replace(/[&<>'"]/g, function (c) {
        return {"&":"&amp;", "<":"&lt;", ">":"&gt;", "'":"&#39;", '"':"&quot;"}[c];
      });
    }

    function route(hash) {
      window.location.hash = hash;
    }

    function categoryCards() {
      return Object.keys(sections).map(function (key) {
        const s = sections[key];
        return '<button class="category-card" style="--accent:' + s.accent + '" data-section="' + key + '">' +
          '<span class="category-number">' + s.number + ' · ' + s.english + '</span>' +
          '<h3>' + s.title + '</h3><p>' + s.summary + '</p>' +
          '<span class="card-route">질문으로 살펴보기 →</span></button>';
      }).join("");
    }

    function renderHome() {
      document.title = "Metabolomics";
      app.innerHTML = '<section class="hero"><div class="container">' +
        '<p class="eyebrow">Metabolomics knowledge base</p><h1>Metabolomics</h1>' +
        '<p class="hero-copy">NMR · MS · Feature table · Annotation · Pathway interpretation</p>' +
        '<form class="hero-search" id="heroSearchForm" role="search"><input id="heroSearch" type="search" aria-label="Metabolomics 통합 검색" placeholder="Search: NMR, XCMS, annotation, SIRIUS, mummichog"><span class="search-icon">⌕</span></form>' +
        '<p class="search-hint">Korean / English / acronym</p></div></section>' +
        '<section class="browse"><div class="container"><div class="section-heading"><h2>어디서부터 볼까요?</h2><p>질문을 따라 큰 구조부터 살펴보세요.</p></div>' +
        '<div class="category-grid">' + categoryCards() + '</div></div></section>';
      document.getElementById("heroSearchForm").addEventListener("submit", function (e) {
        e.preventDefault();
        const q = document.getElementById("heroSearch").value.trim();
        if (q) route("search/" + encodeURIComponent(q));
      });
      window.scrollTo(0, 0);
    }

    function renderSection(key) {
      const s = sections[key];
      if (!s) return renderHome();
      document.title = s.title + " · Metabolomics";
      const annotateOnce = createAnnotator();
      const groups = s.groups.map(function (group, i) {
        const items = group.items.map(function (item) {
          const hasPage = Boolean(item[0] && articles[item[0]]);
          return '<div class="concept-row"><strong>' + annotateOnce(item[1]) + '</strong><p>' + annotateOnce(item[2]) + '</p>' +
            (hasPage ? '<button data-article="' + item[0] + '">읽기 →</button>' : '<span class="map-label">개념 지도</span>') + '</div>';
        }).join("");
        return '<section class="question-block"><div class="question-head"><small>QUESTION ' + String(i + 1).padStart(2, "0") + '</small>' +
          '<h2>' + annotateOnce(group.q) + '</h2><p>' + annotateOnce(group.note) + '</p></div><div>' + items + '</div></section>';
      }).join("");
      app.innerHTML = '<div class="container"><nav class="breadcrumb" aria-label="현재 위치"><button data-route="home">홈</button><span>›</span>' + s.title + '</nav>' +
        '<header class="page-header" style="border-top:4px solid ' + s.accent + '"><p class="eyebrow">' + s.number + ' · ' + s.english + '</p><h1>' + s.title + '</h1><p class="lead">' + s.summary + '</p></header>' +
        '<div class="question-list">' + groups + '</div></div>';
      window.scrollTo(0, 0);
    }

    function articleText(a) {
      const bodyText = a.body.map(function (b) { return [b[0]].concat(Array.isArray(b[1]) ? b[1] : [b[1]]).join(" "); });
      return [a.title, a.aliases.join(" "), a.summary].concat(bodyText).join(" ").toLowerCase();
    }

    function highlight(text, query) {
      if (!query) return esc(text);
      const safe = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      return esc(text).replace(new RegExp("(" + safe + ")", "ig"), "<mark>$1</mark>");
    }

    function searchArticles(query, filter) {
      const q = query.trim().toLowerCase();
      if (!q) return [];
      return Object.keys(articles).map(function (id) {
        const a = articles[id];
        if (filter !== "all" && a.section !== filter) return null;
        const hay = articleText(a);
        const pos = hay.indexOf(q);
        if (pos < 0) return null;
        const titleHit = a.title.toLowerCase().includes(q) ? 3 : 0;
        const aliasHit = a.aliases.join(" ").toLowerCase().includes(q) ? 2 : 0;
        return { id: id, article: a, score: titleHit + aliasHit + 1 };
      }).filter(Boolean).sort(function (a, b) { return b.score - a.score || a.article.title.localeCompare(b.article.title); });
    }

    function renderSearch(query) {
      document.title = '"' + query + '" 검색 · Metabolomics';
      const filterButtons = ['<button class="filter-btn ' + (activeFilter === "all" ? "active" : "") + '" data-filter="all">전체</button>'].concat(
        Object.keys(sections).map(function (key) { return '<button class="filter-btn ' + (activeFilter === key ? "active" : "") + '" data-filter="' + key + '">' + sections[key].title + '</button>'; })
      ).join("");
      const found = searchArticles(query, activeFilter);
      const cards = found.length ? found.map(function (r) {
        const s = sections[r.article.section];
        return '<button class="result-card" data-article="' + r.id + '"><span class="result-path">' + s.title + ' › 문서</span>' +
          '<h2>' + highlight(r.article.title, query) + '</h2><p>' + highlight(r.article.summary, query) + '</p></button>';
      }).join("") : '<div class="empty"><strong>No results</strong><br>Try: English / Korean / acronym</div>';
      app.innerHTML = '<div class="container search-page"><nav class="breadcrumb"><button data-route="home">홈</button><span>›</span>검색</nav>' +
        '<header class="page-header"><p class="eyebrow">Search</p><h1>“' + esc(query) + '”</h1></header>' +
        '<div class="search-summary"><p>Public pages · <strong>' + found.length + '</strong></p><div class="filters">' + filterButtons + '</div></div>' +
        '<div class="results">' + cards + '</div></div>';
      topSearch.value = query;
      window.scrollTo(0, 0);
    }

    function getSources(id) {
      return (sourceLinks[id] || []).concat(officialSupplementLinks[id] || []);
    }

    function renderArticle(id) {
      const a = articles[id];
      if (!a) return renderHome();
      const s = sections[a.section];
      const annotateOnce = createAnnotator();
      document.title = a.title + " · Metabolomics";
      const body = a.body.map(function (part) {
        const points = Array.isArray(part[1]) ? part[1] : part[1].replace(/\.\s+/g, ".||| ").split("|||").filter(Boolean);
        return '<section><h2>' + part[0] + '</h2><ul class="fact-list">' + points.map(function (point) { return "<li>" + annotateOnce(point.trim()) + "</li>"; }).join("") + "</ul></section>";
      }).join("");
      const related = a.related.filter(function (rid) { return articles[rid]; }).map(function (rid) {
        return '<button data-article="' + rid + '">' + articles[rid].title + ' →</button>';
      }).join("");
      const sources = getSources(id).map(function (source) {
        return '<a href="' + esc(source[1]) + '" target="_blank" rel="noopener noreferrer">' + esc(source[0]) + ' ↗</a>';
      }).join("");
      app.innerHTML = '<div class="container"><nav class="breadcrumb"><button data-route="home">홈</button><span>›</span><button data-section="' + a.section + '">' + s.title + '</button><span>›</span>' + a.title + '</nav>' +
        '<div class="article-layout"><article class="article"><p class="eyebrow">' + s.title + '</p><h1>' + a.title + '</h1>' +
        '<p class="aliases">Aliases: ' + a.aliases.join(" · ") + '</p><p class="tooltip-hint">점선 용어: hover / focus → 한 줄 설명</p><p class="definition">' + annotateOnce(a.summary) + '</p>' + body + '</article>' +
        '<aside class="aside"><div class="aside-box"><h3>Related</h3><div class="related-list">' + related + '</div></div>' +
        (sources ? '<div class="aside-box source-box"><h3>Resources / External links</h3><div class="source-list">' + sources + '</div></div>' : '') +
        '</aside></div></div>';
      window.scrollTo(0, 0);

    function handleRoute() {
      const raw = window.location.hash.replace(/^#/, "");
      const parts = raw.split("/");
      if (!raw || raw === "home") return renderHome();
      if (parts[0] === "section") return renderSection(parts[1]);
      if (parts[0] === "article") return renderArticle(parts[1]);
      if (parts[0] === "search") return renderSearch(decodeURIComponent(parts.slice(1).join("/")));
      renderHome();
    }

    document.addEventListener("click", function (e) {
      const home = e.target.closest("[data-route='home']");
      const section = e.target.closest("[data-section]");
      const article = e.target.closest("[data-article]");
      const filter = e.target.closest("[data-filter]");
      if (home) route("home");
      else if (article) route("article/" + article.dataset.article);
      else if (section) route("section/" + section.dataset.section);
      else if (filter) { activeFilter = filter.dataset.filter; const q = decodeURIComponent(window.location.hash.split("/").slice(1).join("/")); renderSearch(q); }
    });

    document.getElementById("topSearchForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const q = topSearch.value.trim();
      if (q) { activeFilter = "all"; route("search/" + encodeURIComponent(q)); }
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "/" && document.activeElement.tagName !== "INPUT") {
        e.preventDefault(); topSearch.focus();
      }
    });
    window.addEventListener("hashchange", handleRoute);
    handleRoute();
  </script>
</body>
</html>

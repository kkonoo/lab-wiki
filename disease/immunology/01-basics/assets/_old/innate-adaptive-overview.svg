<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 730" role="img" aria-labelledby="title desc"><title id="title">선천·적응면역 overview</title><desc id="desc">장벽과 선천면역의 감지가 DC 항원 제시를 통해 적응면역으로 연결되고, 항체와 T세포가 선천 effector를 다시 동원하는 흐름.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#929b94"/></marker></defs><rect width="100%" height="100%" fill="#fbfcf9"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="32" y="42" font-size="25" fill="#18211b" font-weight="700" text-anchor="start">같은 방어 체계의 두 축: 선천면역과 적응면역</text><rect x="32" y="74" width="1026" height="70" rx="12" fill="#f2f5ef" stroke="#d8ddd7"/><text x="54" y="103" font-size="19" fill="#18211b" font-weight="700" text-anchor="start">장벽 · Barrier</text><text x="54" y="129" font-size="17" fill="#667168" font-weight="400" text-anchor="start">피부·점막·분비물 → 침입 억제 · 감염·조직 손상 시 면역반응 시작</text><rect x="32" y="183" width="450" height="240" rx="12" fill="#edf4f8" stroke="#315d78"/><rect x="608" y="183" width="450" height="240" rx="12" fill="#f7edf2" stroke="#6f3a55"/><text x="55" y="217" font-size="23" fill="#315d78" font-weight="700" text-anchor="start">선천 · INNATE</text><text x="631" y="217" font-size="23" fill="#6f3a55" font-weight="700" text-anchor="start">적응 · ADAPTIVE</text><text x="55" y="257" font-size="16" fill="#18211b" font-weight="400" text-anchor="start">PRR 등으로 감염·손상 신호 감지</text><text x="55" y="299" font-size="16" fill="#18211b" font-weight="400" text-anchor="start">Neutrophil · Monocyte / Macrophage · DC</text><text x="55" y="341" font-size="16" fill="#18211b" font-weight="400" text-anchor="start">NK / ILC · Mast cell · Eosinophil · Basophil</text><text x="55" y="383" font-size="16" fill="#18211b" font-weight="400" text-anchor="start">식세포작용 · 염증 · 세포독성 · 보체</text><text x="631" y="257" font-size="17" fill="#18211b" font-weight="400" text-anchor="start">다양한 BCR / TCR로 항원 인식</text><text x="631" y="299" font-size="17" fill="#18211b" font-weight="400" text-anchor="start">B세포 → 형질세포 → 항체</text><text x="631" y="341" font-size="17" fill="#18211b" font-weight="400" text-anchor="start">T세포 → 도움·조절 / 감염세포 제거</text><text x="631" y="383" font-size="17" fill="#18211b" font-weight="400" text-anchor="start">클론 확장 · effector 분화 · 기억 형성</text><path d="M483 282 H608" fill="none" stroke="#929b94" stroke-width="2" marker-end="url(#arrow)"/><text x="545" y="248" font-size="17" fill="#315d78" font-weight="700" text-anchor="middle">DC</text><text x="545" y="309" font-size="12" fill="#667168" font-weight="400" text-anchor="middle">항원 제시</text><text x="545" y="330" font-size="12" fill="#667168" font-weight="400" text-anchor="middle">공동자극</text><text x="545" y="351" font-size="12" fill="#667168" font-weight="400" text-anchor="middle">cytokine</text><path d="M810 423 V463 H257 V423" fill="none" stroke="#929b94" stroke-width="2" marker-end="url(#arrow)"/><text x="545" y="492" font-size="17" fill="#18211b" font-weight="600" text-anchor="middle">항체의 Fc 기능·T세포 cytokine → 선천 effector를 다시 동원</text><rect x="32" y="531" width="1026" height="103" rx="12" fill="#fff" stroke="#d8ddd7"/><text x="54" y="563" font-size="19" fill="#18211b" font-weight="700" text-anchor="start">만들어지는 곳 → 만나는 곳 → 작동하는 곳</text><text x="54" y="593" font-size="16" fill="#18211b" font-weight="400" text-anchor="start">골수·흉선 (1차 림프기관) → 림프절·비장·점막 림프조직 (2차) → 감염·손상 조직</text><text x="54" y="617" font-size="14" fill="#667168" font-weight="400" text-anchor="start">T세포도 골수 유래 전구세포에서 출발 → 흉선에서 성숙 · 2차 기관은 항원과 림프구의 만남터</text><text x="32" y="673" font-size="16" fill="#6f3a55" font-weight="700" text-anchor="start">02 선천면역 → 감지·염증       03 적응 I → 인식·발달       04 적응 II → 실행·조직·기억</text><text x="32" y="705" font-size="14" fill="#667168" font-weight="400" text-anchor="start">색은 대표 역할 · DC·항체·cytokine이 두 축을 연결 · NK를 적응면역으로 분류하지 않기</text></g></svg>
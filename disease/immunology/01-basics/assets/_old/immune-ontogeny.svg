<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 660" role="img" aria-labelledby="title desc"><title id="title">태아 조혈과 출생 전후 면역 발달</title><desc id="desc">난황낭, AGM, 태아 간, 태아 골수의 주요 조혈 흐름과 태아기 특이 집단, 산모와 모유 및 미생물 입력에 의해 조정되는 영아 면역 프로그램.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#929b94"/></marker></defs><rect width="100%" height="100%" fill="#fbfcf9"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="32" y="40" font-size="25" fill="#18211b" font-weight="700" text-anchor="start">시간 축 · 하나의 성숙 사다리보다, 시기별 프로그램</text><text x="32" y="72" font-size="16" fill="#667168" font-weight="400" text-anchor="start">태아 조혈의 여러 wave와 기관 간 인계 → 출생 전후 환경이 조정하는 면역계</text><text x="32" y="125" font-size="19" fill="#6f3a55" font-weight="700" text-anchor="start">태아기 · 조혈의 주요 장소</text><rect x="32" y="159" width="212" height="66" rx="12" fill="#fff" stroke="#6f3a55"/><text x="46" y="185" font-size="18" fill="#6f3a55" font-weight="700" text-anchor="start">Yolk sac</text><text x="46" y="208" font-size="13" fill="#667168" font-weight="400" text-anchor="start">난황낭 · 초기 조혈</text><rect x="303" y="159" width="212" height="66" rx="12" fill="#fff" stroke="#6f3a55"/><text x="317" y="185" font-size="18" fill="#6f3a55" font-weight="700" text-anchor="start">AGM</text><text x="317" y="208" font-size="13" fill="#667168" font-weight="400" text-anchor="start">배아 조혈줄기·전구세포</text><rect x="574" y="159" width="212" height="66" rx="12" fill="#fff" stroke="#6f3a55"/><text x="588" y="185" font-size="18" fill="#6f3a55" font-weight="700" text-anchor="start">Fetal liver</text><text x="588" y="208" font-size="13" fill="#667168" font-weight="400" text-anchor="start">태아 간 · 면역세포 생산</text><rect x="845" y="159" width="212" height="66" rx="12" fill="#fff" stroke="#6f3a55"/><text x="859" y="185" font-size="18" fill="#6f3a55" font-weight="700" text-anchor="start">Fetal marrow</text><text x="859" y="208" font-size="13" fill="#667168" font-weight="400" text-anchor="start">태아 골수 · 조혈 확대</text><path d="M245 192 H302" fill="none" stroke="#929b94" stroke-width="2" marker-end="url(#arrow)"/><path d="M516 192 H573" fill="none" stroke="#929b94" stroke-width="2" marker-end="url(#arrow)"/><path d="M787 192 H844" fill="none" stroke="#929b94" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="262" font-size="15" fill="#667168" font-weight="400" text-anchor="start">순서도는 주요 흐름의 요약 · 여러 wave가 겹치며, 모든 조직세포가 한 줄을 따라 교체되는 것은 아님</text><rect x="32" y="303" width="483" height="196" rx="12" fill="#f7edf2" stroke="#6f3a55"/><rect x="545" y="303" width="513" height="196" rx="12" fill="#edf4f8" stroke="#315d78"/><text x="53" y="340" font-size="22" fill="#6f3a55" font-weight="700" text-anchor="start">태아기 구성</text><text x="53" y="382" font-size="16" fill="#18211b" font-weight="400" text-anchor="start">태아기에 두드러진 B-1·innate T 집단</text><text x="53" y="420" font-size="16" fill="#18211b" font-weight="400" text-anchor="start">조직 형성·혈관 발달과 연결된 macrophage</text><text x="53" y="458" font-size="16" fill="#18211b" font-weight="400" text-anchor="start">전사체 궤적의 기원 추론 ≠ 실제 계통추적</text><text x="566" y="340" font-size="22" fill="#315d78" font-weight="700" text-anchor="start">출생 전후 · 영아기 프로그램</text><text x="566" y="382" font-size="16" fill="#18211b" font-weight="400" text-anchor="start">산모 IgG·모유·미생물·대사산물의 입력</text><text x="566" y="420" font-size="16" fill="#18211b" font-weight="400" text-anchor="start">관용·조직 보호·빠른 effector 반응의 특화</text><text x="566" y="458" font-size="16" fill="#18211b" font-weight="400" text-anchor="start">폐·장과 림프기관에서 다른 기억세포 축적</text><path d="M270 499 V542 H796 V499" fill="none" stroke="#929b94" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="591" font-size="22" fill="#18211b" font-weight="700" text-anchor="start">영아 면역 = 성인 면역의 단순한 축소판이 아님</text><text x="32" y="626" font-size="17" fill="#667168" font-weight="400" text-anchor="start">세포 정체성 + 기관의 환경 + 발달 시기 → 같은 이름의 세포도 다른 상태와 기능</text></g></svg>
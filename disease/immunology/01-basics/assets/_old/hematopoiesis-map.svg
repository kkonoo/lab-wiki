<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 900" role="img" aria-labelledby="title desc"><title id="title">조혈·면역세포 계통도</title><desc id="desc">HSC에서 골수계와 림프계로 이어지는 학습용 지도. NK와 ILC는 림프계이지만 선천면역. NKT는 T세포의 한 종류. DC 기원과 태아 유래 조직 대식세포는 별도 주의.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#929b94"/></marker></defs><rect width="100%" height="100%" fill="#fbfcf9"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="32" y="38" font-size="26" fill="#18211b" font-weight="700" text-anchor="start">혈액세포의 출발점과 면역계의 구성원</text><text x="32" y="67" font-size="15" fill="#667168" font-weight="400" text-anchor="start">계통은 화살표로, 대표 면역 역할은 색으로 · 중간 단계가 생략된 학습용 지도</text><rect x="390" y="98" width="300" height="66" rx="12" fill="#fff" stroke="#667168"/><text x="404" y="124" font-size="18" fill="#667168" font-weight="700" text-anchor="start">HSC · 조혈줄기세포</text><text x="404" y="147" font-size="13" fill="#667168" font-weight="400" text-anchor="start">자가 재생 · 혈액세포 계통의 출발점</text><path d="M540 164 V190 H280 V216" fill="none" stroke="#929b94" stroke-width="2" marker-end="url(#arrow)"/><path d="M540 190 H825 V216" fill="none" stroke="#929b94" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="216" width="420" height="66" rx="12" fill="#fff" stroke="#315d78"/><text x="84" y="242" font-size="18" fill="#315d78" font-weight="700" text-anchor="start">Myeloid · 골수계</text><text x="84" y="265" font-size="13" fill="#667168" font-weight="400" text-anchor="start">CMP를 포함하는 고전적 골수계 분화 축</text><rect x="600" y="216" width="420" height="66" rx="12" fill="#fff" stroke="#6f3a55"/><text x="614" y="242" font-size="18" fill="#6f3a55" font-weight="700" text-anchor="start">Lymphoid · 림프계</text><text x="614" y="265" font-size="13" fill="#667168" font-weight="400" text-anchor="start">CLP를 포함하는 고전적 림프계 분화 축</text><path d="M280 282 V304 H39 V665" fill="none" stroke="#929b94" stroke-width="2" marker-end="url(#arrow)"/><path d="M825 282 V304 H572 V550" fill="none" stroke="#929b94" stroke-width="2" marker-end="url(#arrow)"/><path d="M39 359 H62" fill="none" stroke="#929b94" stroke-width="2" marker-end="url(#arrow)"/><path d="M572 359 H596" fill="none" stroke="#929b94" stroke-width="2" marker-end="url(#arrow)"/><path d="M39 449 H62" fill="none" stroke="#929b94" stroke-width="2" marker-end="url(#arrow)"/><path d="M572 449 H596" fill="none" stroke="#929b94" stroke-width="2" marker-end="url(#arrow)"/><path d="M39 539 H62" fill="none" stroke="#929b94" stroke-width="2" marker-end="url(#arrow)"/><path d="M572 539 H596" fill="none" stroke="#929b94" stroke-width="2" marker-end="url(#arrow)"/><path d="M39 629 H62" fill="none" stroke="#929b94" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="326" width="420" height="66" rx="12" fill="#fff" stroke="#667168"/><text x="84" y="352" font-size="18" fill="#667168" font-weight="700" text-anchor="start">RBC · 적혈구 / Platelet · 혈소판</text><text x="84" y="375" font-size="13" fill="#667168" font-weight="400" text-anchor="start">적혈구: 산소 운반 · 거핵세포 → 혈소판: 지혈</text><rect x="70" y="416" width="420" height="66" rx="12" fill="#fff" stroke="#315d78"/><text x="84" y="442" font-size="18" fill="#315d78" font-weight="700" text-anchor="start">Neutrophil · Eosinophil · Basophil</text><text x="84" y="465" font-size="13" fill="#667168" font-weight="400" text-anchor="start">호중구 · 호산구 · 호염기구 / 혈액 과립구</text><rect x="70" y="506" width="420" height="66" rx="12" fill="#fff" stroke="#315d78"/><text x="84" y="532" font-size="18" fill="#315d78" font-weight="700" text-anchor="start">Monocyte → Macrophage</text><text x="84" y="555" font-size="13" fill="#667168" font-weight="400" text-anchor="start">단핵구 → 조직 대식세포로 분화하는 경로</text><rect x="70" y="596" width="420" height="66" rx="12" fill="#fff" stroke="#315d78"/><text x="84" y="622" font-size="18" fill="#315d78" font-weight="700" text-anchor="start">Mast cell · 비만세포</text><text x="84" y="645" font-size="13" fill="#667168" font-weight="400" text-anchor="start">조직에서 성숙 · 혈액 감별계산의 PMN과 구별</text><rect x="600" y="326" width="420" height="66" rx="12" fill="#fff" stroke="#6f3a55"/><text x="614" y="352" font-size="18" fill="#6f3a55" font-weight="700" text-anchor="start">B cell → Plasma cell / Memory B</text><text x="614" y="375" font-size="13" fill="#667168" font-weight="400" text-anchor="start">B세포 → 항체 분비 형질세포 / 기억 B세포</text><rect x="600" y="416" width="420" height="66" rx="12" fill="#fff" stroke="#6f3a55"/><text x="614" y="442" font-size="18" fill="#6f3a55" font-weight="700" text-anchor="start">T cell → CD4 / CD8 / Memory T</text><text x="614" y="465" font-size="13" fill="#667168" font-weight="400" text-anchor="start">흉선에서 성숙 · 도움·조절 / 세포독성 / 기억</text><rect x="600" y="506" width="420" height="66" rx="12" fill="#fff" stroke="#315d78"/><text x="614" y="532" font-size="18" fill="#315d78" font-weight="700" text-anchor="start">NK / ILC · 선천 림프구</text><text x="614" y="555" font-size="13" fill="#667168" font-weight="400" text-anchor="start">림프계이면서 선천면역 역할</text><path d="M1020 449 H1043 V629 H1021" fill="none" stroke="#929b94" stroke-width="2" marker-end="url(#arrow)"/><rect x="600" y="596" width="420" height="66" rx="12" fill="#fff" stroke="#936f21"/><text x="614" y="622" font-size="18" fill="#936f21" font-weight="700" text-anchor="start">NKT · T세포의 한 종류</text><text x="614" y="645" font-size="13" fill="#667168" font-weight="400" text-anchor="start">NK와 별개 · TCR 보유 · innate-like T</text><rect x="70" y="701" width="950" height="77" rx="12" fill="#f3f5f0" stroke="#d8ddd7"/><text x="89" y="730" font-size="18" fill="#315d78" font-weight="700" text-anchor="start">DC · 수지상세포</text><text x="89" y="755" font-size="16" fill="#18211b" font-weight="400" text-anchor="start">별도의 전구·분화 경로와 아형 · 항원 제시로 선천 → 적응 연결</text><path d="M540 164 V725 H507" fill="none" stroke="#667168" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="32" y="817" font-size="14" fill="#667168" font-weight="400" text-anchor="start">파랑: 대표 선천 역할    자주: 대표 적응 역할    황토: innate-like T    회색: 줄기세포·기타 혈액세포</text><text x="32" y="849" font-size="14" fill="#667168" font-weight="400" text-anchor="start">주의 ① CMP/CLP의 칼같은 이분법은 단순화 · DC의 복수 기원과 연속적 분화 경로 생략</text><text x="32" y="875" font-size="14" fill="#667168" font-weight="400" text-anchor="start">주의 ② 조직 대식세포에는 태아 유래·자기 유지 집단도 포함 · 모두가 혈중 monocyte 유래는 아님</text></g></svg>
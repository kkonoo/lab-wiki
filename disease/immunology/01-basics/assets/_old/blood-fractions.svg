<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 728" role="img" aria-labelledby="title desc"><title id="title">전혈·혈장·혈청·buffy coat·PBMC</title><desc id="desc">항응고 전혈을 원심분리하면 혈장, 백혈구와 혈소판의 buffy coat, 적혈구층. 응고 후에는 혈청과 응고물. 밀도구배 PBMC는 buffy coat와 다른 분획.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#929b94"/></marker></defs><rect width="100%" height="100%" fill="#fbfcf9"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="32" y="40" font-size="26" fill="#18211b" font-weight="700" text-anchor="start">같은 채혈, 서로 다른 분획</text><text x="32" y="69" font-size="16" fill="#667168" font-weight="400" text-anchor="start">층 두께는 모식도 · 부피 비율과 세포 수 비율은 서로 다른 분모</text><rect x="48" y="144" width="96" height="224" rx="35" fill="#fff" stroke="#819083"/><rect x="57" y="159" width="78" height="189" fill="#ae3c51"/><text x="96" y="407" font-size="18" fill="#18211b" font-weight="700" text-anchor="middle">Whole blood</text><text x="96" y="436" font-size="17" fill="#667168" font-weight="400" text-anchor="middle">전혈</text><path d="M157 215 H294" fill="none" stroke="#929b94" stroke-width="2" marker-end="url(#arrow)"/><text x="219" y="173" font-size="17" fill="#315d78" font-weight="700" text-anchor="middle">항응고제</text><text x="219" y="195" font-size="15" fill="#667168" font-weight="400" text-anchor="middle">+ 원심분리</text><rect x="314" y="144" width="96" height="224" rx="35" fill="#fff" stroke="#819083"/><rect x="323" y="159" width="78" height="99" fill="#e9cd79"/><rect x="323" y="258" width="78" height="13" fill="#f5ede0"/><rect x="323" y="271" width="78" height="77" fill="#ae3c51"/><path d="M412 188 H444" fill="none" stroke="#929b94" stroke-width="2" marker-end="url(#arrow)"/><text x="458" y="185" font-size="19" fill="#18211b" font-weight="700" text-anchor="start">Plasma · 혈장</text><text x="458" y="211" font-size="14" fill="#667168" font-weight="400" text-anchor="start">fibrinogen 등 응고인자 포함</text><path d="M412 266 H444" fill="none" stroke="#929b94" stroke-width="2" marker-end="url(#arrow)"/><text x="458" y="263" font-size="19" fill="#18211b" font-weight="700" text-anchor="start">Buffy coat</text><text x="458" y="289" font-size="14" fill="#667168" font-weight="400" text-anchor="start">백혈구 + 혈소판</text><path d="M412 335 H444" fill="none" stroke="#929b94" stroke-width="2" marker-end="url(#arrow)"/><text x="458" y="332" font-size="19" fill="#18211b" font-weight="700" text-anchor="start">RBC · 적혈구층</text><text x="458" y="358" font-size="14" fill="#667168" font-weight="400" text-anchor="start">세포 수 기준과 부피 기준의 구별</text><rect x="35" y="480" width="678" height="141" rx="12" fill="#edf4f8" stroke="#315d78"/><text x="54" y="511" font-size="21" fill="#315d78" font-weight="700" text-anchor="start">PBMC · 말초혈액 단핵세포</text><text x="54" y="540" font-size="17" fill="#18211b" font-weight="400" text-anchor="start">밀도구배 분리 → 림프구 + 단핵구 중심의 분획</text><text x="54" y="569" font-size="16" fill="#18211b" font-weight="400" text-anchor="start">통상적인 PBMC 준비에서 과립구·적혈구는 대부분 제거</text><text x="54" y="598" font-size="16" fill="#667168" font-weight="400" text-anchor="start">Buffy coat와 PBMC는 같은 말이 아님 · 혈소판 잔존 가능</text><rect x="748" y="116" width="310" height="505" rx="12" fill="#fcf7ee" stroke="#decba0"/><text x="770" y="150" font-size="19" fill="#936f21" font-weight="700" text-anchor="start">응고 허용 → 원심분리</text><rect x="852" y="179" width="96" height="224" rx="35" fill="#fff" stroke="#819083"/><rect x="861" y="194" width="78" height="96" fill="#e9cd79"/><rect x="861" y="290" width="78" height="93" fill="#833a40"/><text x="903" y="440" font-size="20" fill="#936f21" font-weight="700" text-anchor="middle">Serum · 혈청</text><text x="770" y="478" font-size="17" fill="#18211b" font-weight="400" text-anchor="start">응고 후 남은 상층액</text><text x="770" y="508" font-size="16" fill="#18211b" font-weight="400" text-anchor="start">fibrinogen의 대부분 제거</text><text x="770" y="538" font-size="15" fill="#18211b" font-weight="400" text-anchor="start">일부 응고 관련 성분의 소비·변화</text><text x="770" y="568" font-size="15" fill="#18211b" font-weight="400" text-anchor="start">아래: fibrin clot + 갇힌 혈액세포</text><text x="32" y="665" font-size="20" fill="#18211b" font-weight="700" text-anchor="start">Whole blood = plasma + RBC + WBC + platelets</text><text x="32" y="696" font-size="17" fill="#6f3a55" font-weight="700" text-anchor="start">Plasma cell = 항체 분비 B세포 계열  ≠  Plasma = 혈장의 액체 성분</text></g></svg>
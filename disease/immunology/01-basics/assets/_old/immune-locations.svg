<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 685" role="img" aria-labelledby="title desc"><title id="title">면역계 장소 지도</title><desc id="desc">골수와 흉선에서 성숙한 면역세포가 혈류를 거쳐 림프절·비장·점막 림프조직에서 항원과 만나고 조직에서 작동. 조직의 림프와 이동성 DC는 배수 림프절로 되돌아오는 연결.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#929b94"/></marker></defs><rect width="100%" height="100%" fill="#fbfcf9"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="32" y="40" font-size="26" fill="#18211b" font-weight="700" text-anchor="start">장소 축 · 만들어지고, 만나고, 작동하는 곳</text><text x="32" y="71" font-size="16" fill="#667168" font-weight="400" text-anchor="start">세포의 이름이 같아도 배수 조직·림프절 환경·이전 면역 경험에 따라 다른 반응</text><rect x="32" y="109" width="300" height="357" rx="12" fill="#fff" stroke="#6f3a55"/><text x="52" y="148" font-size="23" fill="#6f3a55" font-weight="700" text-anchor="start">01 · 발생·성숙</text><rect x="395" y="109" width="300" height="357" rx="12" fill="#fff" stroke="#315d78"/><text x="415" y="148" font-size="23" fill="#315d78" font-weight="700" text-anchor="start">02 · 항원과 만남</text><rect x="758" y="109" width="300" height="357" rx="12" fill="#fff" stroke="#936f21"/><text x="778" y="148" font-size="23" fill="#936f21" font-weight="700" text-anchor="start">03 · 기능 실행</text><rect x="53" y="180" width="258" height="66" rx="12" fill="#fff" stroke="#6f3a55"/><text x="67" y="206" font-size="18" fill="#6f3a55" font-weight="700" text-anchor="start">골수 · Bone marrow</text><text x="67" y="229" font-size="13" fill="#667168" font-weight="400" text-anchor="start">조혈 · B세포 발달</text><rect x="53" y="276" width="258" height="66" rx="12" fill="#fff" stroke="#6f3a55"/><text x="67" y="302" font-size="18" fill="#6f3a55" font-weight="700" text-anchor="start">흉선 · Thymus</text><text x="67" y="325" font-size="13" fill="#667168" font-weight="400" text-anchor="start">골수 유래 T전구세포의 성숙</text><text x="52" y="391" font-size="18" fill="#6f3a55" font-weight="700" text-anchor="start">1차 림프기관</text><text x="52" y="421" font-size="14" fill="#667168" font-weight="400" text-anchor="start">혈류를 통해 이동하는 성숙 세포</text><rect x="416" y="180" width="258" height="66" rx="12" fill="#fff" stroke="#315d78"/><text x="430" y="206" font-size="18" fill="#315d78" font-weight="700" text-anchor="start">림프절 · Lymph node</text><text x="430" y="229" font-size="13" fill="#667168" font-weight="400" text-anchor="start">림프를 통해 조직 항원 유입</text><rect x="416" y="276" width="258" height="66" rx="12" fill="#fff" stroke="#315d78"/><text x="430" y="302" font-size="18" fill="#315d78" font-weight="700" text-anchor="start">비장 · Spleen</text><text x="430" y="325" font-size="13" fill="#667168" font-weight="400" text-anchor="start">혈액의 항원과 접하는 기관</text><text x="415" y="391" font-size="18" fill="#315d78" font-weight="700" text-anchor="start">2차 림프기관</text><text x="415" y="421" font-size="14" fill="#667168" font-weight="400" text-anchor="start">점막 림프조직도 항원과의 만남터</text><rect x="779" y="180" width="258" height="66" rx="12" fill="#fff" stroke="#936f21"/><text x="793" y="206" font-size="18" fill="#936f21" font-weight="700" text-anchor="start">감염·손상 조직</text><text x="793" y="229" font-size="13" fill="#667168" font-weight="400" text-anchor="start">침윤 effector + 조직 상주 세포</text><rect x="779" y="276" width="258" height="66" rx="12" fill="#fff" stroke="#936f21"/><text x="793" y="302" font-size="18" fill="#936f21" font-weight="700" text-anchor="start">국소 미세환경</text><text x="793" y="325" font-size="13" fill="#667168" font-weight="400" text-anchor="start">stroma · cytokine · 대사 신호</text><text x="778" y="391" font-size="18" fill="#936f21" font-weight="700" text-anchor="start">방어·관용·조직 항상성</text><text x="778" y="421" font-size="14" fill="#667168" font-weight="400" text-anchor="start">장소와 시기에 따라 달라지는 역할</text><path d="M333 223 H394" fill="none" stroke="#929b94" stroke-width="2" marker-end="url(#arrow)"/><path d="M696 223 H757" fill="none" stroke="#929b94" stroke-width="2" marker-end="url(#arrow)"/><path d="M909 466 V508 H545 V466" fill="none" stroke="#929b94" stroke-width="2" marker-end="url(#arrow)"/><text x="728" y="535" font-size="16" fill="#315d78" font-weight="600" text-anchor="middle">조직 → 림프·이동성 DC → 배수 림프절</text><rect x="32" y="568" width="1026" height="87" rx="12" fill="#edf4f8" stroke="#d8ddd7"/><text x="53" y="601" font-size="19" fill="#315d78" font-weight="700" text-anchor="start">림프절은 같은 부품으로 된 복제품이 아님</text><text x="53" y="631" font-size="16" fill="#18211b" font-weight="400" text-anchor="start">유입 세포·용질 + 상주 memory·Treg·TFH + 구조세포 → 배수 부위마다 다른 반응 맥락</text></g></svg>
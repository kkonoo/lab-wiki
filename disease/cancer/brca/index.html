<!doctype html>
<html lang="ko">
<head>
  <link rel="icon" href="../../../assets/img/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../../../assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../../../assets/img/favicon-192.png">

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="유방암(BRCA)을 원인(분자초상)·증상·치료의 질문으로 탐색하는 HaLab Wiki Human diseases">
  <title>Breast Cancer (BRCA) · HaLab Wiki</title>
  <link rel="stylesheet" href="../../../assets/css/base.css">
  <link rel="stylesheet" href="../../../assets/css/spa.css">
</head>
<body data-domain="disease">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-group"><a class="brand brand-home" href="../../../index.html"><img class="mark" src="../../../assets/img/symbol.png" alt="">HaLab Wiki</a><a class="brand brand-domain" href="../../index.html"><span>/ Human diseases</span></a><a class="brand brand-domain" href="../index.html"><span>/ Cancer</span></a><button class="brand brand-domain" type="button" data-route="home"><span>/ BRCA</span></button></div>
      <nav class="domain-nav" aria-label="도메인">
        <a href="../../../gwas/index.html">GWAS</a>
        <a href="../../../omics/index.html">Omics</a>
        <a href="../../../single-cell/index.html">Single-cell</a>
        <a href="../../../multi-omics/index.html">Multi-omics</a>
        <a href="../../../disease/index.html" aria-current="page">Diseases</a>
      </nav>
      <form class="top-search" id="topSearchForm" role="search">
        <input id="topSearch" type="search" aria-label="위키 검색" placeholder="Search term / acronym">
        <span class="keycap">/</span>
      </form>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer>
    <div class="container"><span>Updated 2026-06-24</span></div>
  </footer>

  <script>
    const sections = {
      "molecular":{"number":"01","title":"원인 — 분자초상과 유전","english":"THE MOLECULAR PORTRAIT OF BREAST TUMORS","accent":"#6f3a55","summary":"TCGA 6-플랫폼 통합 · 4개 분자 class · driver · germline","groups":[
        {"q":"유방암을 분자로 나누면 무엇이 보이는가?","note":"6개 플랫폼 통합이 만든 4개 주요 class","items":[
          ["brca-molecular-portrait","유방암 분자초상 (TCGA 2012)","825명·6 플랫폼 통합 분석이 4개 주요 분자 class를 확립"]
        ]}
      ]},
      "clinical":{"number":"02","title":"증상·치료 — 임상","english":"FROM SUBTYPE TO TREATMENT","accent":"#1f5d43","summary":"역학·surrogate subtype · 내분비/항HER2/PARP 치료 · de-escalation","groups":[
        {"q":"이 분자 분류가 실제 진료에서는 어떻게 쓰이는가?","note":"surrogate subtype별로 치료가 갈림","items":[
          ["brca-clinical","유방암 임상 — surrogate subtype과 치료","HR+ 내분비요법·HER2+ 항HER2·BRCA 변이 PARP억제제"]
        ]}
      ]}
    };
    const articleRows = [
      ["brca-molecular-portrait","유방암 분자초상 (TCGA 2012)",["breast cancer","BRCA","TCGA","intrinsic subtype","luminal","HER2-enriched","basal-like"],"molecular",
       "유방암 825명을 6개 분자 플랫폼으로 통합 분석한 TCGA landmark가 4개 주요 분자 class와 subtype별 driver를 확립했다",
       [["통합이 만드는 분류",["exome·CNV·methylation·mRNA·miRNA·RPPA(단백) 6개 플랫폼을 같은 종양에서 측정","5개 플랫폼 통합 시 4개 주요 분자 class로 수렴","intrinsic subtype(luminal A/B·HER2-enriched·basal-like)이 여러 층(발현·변이·CNV·methylation·단백)에서 뒷받침됨"]],
        ["driver와 공통성",["전체 >10% 변이 유전자는 TP53·PIK3CA·GATA3 셋뿐 — 나머지는 subtype별로 갈림(luminal A=PIK3CA 45%, basal=TP53 80%)","TBX3·RUNX1·CBFB·SF3B1 등 신규 significantly mutated gene 동정","basal-like 유방암이 high-grade serous 난소암과 분자적으로 유사 — 암종을 가로지르는 병인 공유 시사","germline 소인이 ~10%(BRCA1/2·ATM·CHEK2 등)"]]],
       ["brca-clinical"]],

      ["brca-clinical","유방암 임상 — surrogate subtype과 치료",["breast cancer","HR+","HER2+","triple-negative","endocrine therapy","PARP inhibitor"],"clinical",
       "유방암은 여성에서 가장 흔한 암으로, 호르몬수용체(HR)·HER2 상태로 정의되는 5개 surrogate subtype에 따라 치료 전략이 갈린다",
       [["역학과 분류",["여성에서 가장 많이 진단되는 암 — 조기 발견 시 70–80%가 치유되나 전이는 아직 incurable","임상에서는 IHC 기반 HR(ER/PR)·HER2 상태로 5개 surrogate subtype을 정의해 TCGA의 분자 subtype을 근사","이 surrogate subtype이 치료 선택의 1차 기준"]],
        ["subtype별 치료",["HR+ — 내분비요법(아로마타제 억제제·tamoxifen 등)이 중심","HER2+ — 항HER2 표적치료(trastuzumab 계열)를 병용","BRCA1/2 변이 보유 종양 — PARP 억제제가 합성치사(synthetic lethality) 기전으로 작동","triple-negative 등 표적이 적은 subtype에는 화학요법·면역치료가 추가 옵션"]],
        ["방향",["biology 근거로 치료를 줄이거나(de-escalation) 늘리는(escalation) 개인화가 진행 중","세계적으로 치료 접근성의 형평성이 남은 과제"]]],
       ["brca-molecular-portrait"]]
    ];

    const articles = Object.fromEntries(articleRows.map(function (row) {
      return [row[0], {title:row[1],aliases:row[2],section:row[3],summary:row[4],body:row[5],related:row[6]}];
    }));

    const sourceLinks = {};
    const officialSupplementLinks = {
      "brca-molecular-portrait":[
        ["NCI — The Cancer Genome Atlas (TCGA)","https://www.cancer.gov/ccg/research/genome-sequencing/tcga"]
      ],
      "brca-clinical":[
        ["NCI — Breast Cancer","https://www.cancer.gov/types/breast"],
        ["NCCN Guidelines for Patients — Breast Cancer","https://www.nccn.org/patients/guidelines/content/PDF/breast-invasive-patient.pdf"]
      ]
    };

    const glossaryTerms = {
      "tcga":{key:"tcga",definition:"The Cancer Genome Atlas. 다수 암종을 멀티오믹스로 통합 분석한 NCI landmark 프로젝트."},
      "hr+":{key:"hrpos",definition:"Hormone receptor-positive. ER/PR 발현 유방암 — 내분비요법의 대상."},
      "her2+":{key:"her2pos",definition:"HER2 단백 과발현/증폭 유방암 — 항HER2 표적치료(trastuzumab 등)의 대상."},
      "parp":{key:"parp",definition:"PARP 억제제. BRCA1/2 변이 종양에서 합성치사(synthetic lethality)로 작동하는 표적치료."},
      "triple-negative":{key:"tnbc",definition:"ER·PR·HER2 모두 음성인 유방암 subtype. 표적이 적어 화학요법·면역치료가 중심."},
      "driver":{key:"driver",definition:"종양 진행을 추동하는 체세포 변이(↔ 부수적 passenger 변이)."}
    };
    const glossaryPattern = /(^|[^A-Za-z0-9])(TCGA|HR\+|HER2\+|PARP|triple-negative|driver)(?=$|[^A-Za-z0-9])/g;

    function createAnnotator() {
      const seen = new Set();
      return function (text) {
        return esc(text).replace(glossaryPattern, function (match, prefix, term) {
          const item = glossaryTerms[term.toLowerCase()];
          if (!item || seen.has(item.key)) return match;
          seen.add(item.key);
          return prefix + '<span class="glossary-term" tabindex="0" data-definition="' + esc(item.definition) + '">' + esc(term) + '</span>';
        });
      };
    }

    const app = document.getElementById("app");
    const topSearch = document.getElementById("topSearch");
    let activeFilter = "all";

    function esc(value) {
      return String(value).replace(/[&<>'"]/g, function (c) {
        return {"&":"&amp;", "<":"&lt;", ">":"&gt;", "'":"&#39;", '"':"&quot;"}[c];
      });
    }

    function route(hash) {
      window.location.hash = hash;
    }

    function categoryCards() {
      return Object.keys(sections).map(function (key) {
        const s = sections[key];
        return '<button class="category-card" data-section="' + key + '">' +
          '<span class="category-number">' + s.number + ' · ' + s.english + '</span>' +
          '<h3>' + s.title + '</h3><p>' + s.summary + '</p>' +
          '<span class="card-route">질문으로 살펴보기 →</span></button>';
      }).join("");
    }

    function renderHome() {
      document.title = "Breast Cancer (BRCA)";
      app.innerHTML = '<section class="hero"><div class="container">' +
        '<p class="eyebrow">Cancer disease knowledge base</p><h1>Breast Cancer (BRCA)</h1>' +
        '<p class="hero-copy">원인(TCGA 분자초상·유전) · 증상·치료(surrogate subtype·내분비/항HER2/PARP)</p>' +
        '<form class="hero-search" id="heroSearchForm" role="search"><input id="heroSearch" type="search" aria-label="BRCA 통합 검색" placeholder="Search: TCGA, HER2, PARP, triple-negative"><span class="search-icon">⌕</span></form>' +
        '<p class="search-hint">Korean / English / acronym</p></div></section>' +
        '<section class="browse"><div class="container"><div class="section-heading"><h2>어디서부터 볼까요?</h2><p>질문을 따라 큰 구조부터 살펴보세요.</p></div>' +
        '<div class="category-grid">' + categoryCards() + '</div></div></section>';
      document.getElementById("heroSearchForm").addEventListener("submit", function (e) {
        e.preventDefault();
        const q = document.getElementById("heroSearch").value.trim();
        if (q) route("search/" + encodeURIComponent(q));
      });
      window.scrollTo(0, 0);
    }

    function renderSection(key) {
      const s = sections[key];
      if (!s) return renderHome();
      document.title = s.title + " · BRCA";
      const annotateOnce = createAnnotator();
      const groups = s.groups.map(function (group, i) {
        const items = group.items.map(function (item) {
          const hasPage = Boolean(item[0] && articles[item[0]]);
          return '<div class="concept-row"><strong>' + annotateOnce(item[1]) + '</strong><p>' + annotateOnce(item[2]) + '</p>' +
            (hasPage ? '<button data-article="' + item[0] + '">읽기 →</button>' : '<span class="map-label">개념 지도</span>') + '</div>';
        }).join("");
        return '<section class="question-block"><div class="question-head"><small>QUESTION ' + String(i + 1).padStart(2, "0") + '</small>' +
          '<h2>' + annotateOnce(group.q) + '</h2><p>' + annotateOnce(group.note) + '</p></div><div>' + items + '</div></section>';
      }).join("");
      app.innerHTML = '<div class="container"><nav class="breadcrumb" aria-label="현재 위치"><button data-route="home">홈</button><span>›</span>' + s.title + '</nav>' +
        '<header class="page-header"><p class="eyebrow">' + s.number + ' · ' + s.english + '</p><h1>' + s.title + '</h1><p class="lead">' + s.summary + '</p></header>' +
        '<div class="question-list">' + groups + '</div></div>';
      window.scrollTo(0, 0);
    }

    function articleText(a) {
      const bodyText = a.body.map(function (b) { return [b[0]].concat(Array.isArray(b[1]) ? b[1] : [b[1]]).join(" "); });
      return [a.title, a.aliases.join(" "), a.summary].concat(bodyText).join(" ").toLowerCase();
    }

    function highlight(text, query) {
      if (!query) return esc(text);
      const safe = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      return esc(text).replace(new RegExp("(" + safe + ")", "ig"), "<mark>$1</mark>");
    }

    function searchArticles(query, filter) {
      const q = query.trim().toLowerCase();
      if (!q) return [];
      return Object.keys(articles).map(function (id) {
        const a = articles[id];
        if (filter !== "all" && a.section !== filter) return null;
        const hay = articleText(a);
        const pos = hay.indexOf(q);
        if (pos < 0) return null;
        const titleHit = a.title.toLowerCase().includes(q) ? 3 : 0;
        const aliasHit = a.aliases.join(" ").toLowerCase().includes(q) ? 2 : 0;
        return { id: id, article: a, score: titleHit + aliasHit + 1 };
      }).filter(Boolean).sort(function (a, b) { return b.score - a.score || a.article.title.localeCompare(b.article.title); });
    }

    function renderSearch(query) {
      document.title = '"' + query + '" 검색 · BRCA';
      const filterButtons = ['<button class="filter-btn ' + (activeFilter === "all" ? "active" : "") + '" data-filter="all">전체</button>'].concat(
        Object.keys(sections).map(function (key) { return '<button class="filter-btn ' + (activeFilter === key ? "active" : "") + '" data-filter="' + key + '">' + sections[key].title + '</button>'; })
      ).join("");
      const found = searchArticles(query, activeFilter);
      const cards = found.length ? found.map(function (r) {
        const s = sections[r.article.section];
        return '<button class="result-card" data-article="' + r.id + '"><span class="result-path">' + s.title + ' › 문서</span>' +
          '<h2>' + highlight(r.article.title, query) + '</h2><p>' + highlight(r.article.summary, query) + '</p></button>';
      }).join("") : '<div class="empty"><strong>No results</strong><br>Try: English / Korean / acronym</div>';
      app.innerHTML = '<div class="container search-page"><nav class="breadcrumb"><button data-route="home">홈</button><span>›</span>검색</nav>' +
        '<header class="page-header"><p class="eyebrow">Search</p><h1>“' + esc(query) + '”</h1></header>' +
        '<div class="search-summary"><p>Public pages · <strong>' + found.length + '</strong></p><div class="filters">' + filterButtons + '</div></div>' +
        '<div class="results">' + cards + '</div></div>';
      topSearch.value = query;
      window.scrollTo(0, 0);
    }

    const paperLinks = {
  "molecular": [
    ["TCGA Network, 2012, Nature", "https://doi.org/10.1038/nature11412"]
  ],
  "clinical": [
    ["Harbeck et al., 2019, Nat Rev Dis Primers", "https://doi.org/10.1038/s41572-019-0111-2"]
  ],
  "tcga": [
    ["TCGA Network, 2012, Nature", "https://doi.org/10.1038/nature11412"]
  ],
  "parp": [
    ["Harbeck et al., 2019, Nat Rev Dis Primers", "https://doi.org/10.1038/s41572-019-0111-2"]
  ],
  "triple-negative": [
    ["TCGA Network, 2012, Nature", "https://doi.org/10.1038/nature11412"],
    ["Harbeck et al., 2019, Nat Rev Dis Primers", "https://doi.org/10.1038/s41572-019-0111-2"]
  ],
  "driver": [
    ["TCGA Network, 2012, Nature", "https://doi.org/10.1038/nature11412"]
  ]
};

    function getSources(id) {
      return (sourceLinks[id] || []).concat(officialSupplementLinks[id] || []);
    }
    function getPapers(id) {
      return paperLinks[id] || [];
    }

    function renderArticle(id) {
      const a = articles[id];
      if (!a) return renderHome();
      const s = sections[a.section];
      const annotateOnce = createAnnotator();
      document.title = a.title + " · BRCA";
      const body = a.body.map(function (part) {
        const points = Array.isArray(part[1]) ? part[1] : part[1].replace(/\.\s+/g, ".||| ").split("|||").filter(Boolean);
        return '<section><h2>' + part[0] + '</h2><ul class="fact-list">' + points.map(function (point) { return "<li>" + annotateOnce(point.trim()) + "</li>"; }).join("") + "</ul></section>";
      }).join("");
      const related = a.related.filter(function (rid) { return articles[rid]; }).map(function (rid) {
        return '<button data-article="' + rid + '">' + articles[rid].title + ' →</button>';
      }).join("");
      const sources = getSources(id).map(function (source) {
        return '<a href="' + esc(source[1]) + '" target="_blank" rel="noopener noreferrer">' + esc(source[0]) + ' ↗</a>';
      }).join("");
      const papers = getPapers(id).map(function (paper) {
        return '<a href="' + esc(paper[1]) + '" target="_blank" rel="noopener noreferrer">' + esc(paper[0]) + ' ↗</a>';
      }).join("");
      app.innerHTML = '<div class="container"><nav class="breadcrumb"><button data-route="home">홈</button><span>›</span><button data-section="' + a.section + '">' + s.title + '</button><span>›</span>' + a.title + '</nav>' +
        '<div class="article-layout"><article class="article"><p class="eyebrow">' + s.title + '</p><h1>' + a.title + '</h1>' +
        '<p class="aliases">Aliases: ' + a.aliases.join(" · ") + '</p><p class="tooltip-hint">점선 용어: hover / focus → 한 줄 설명</p><p class="definition">' + annotateOnce(a.summary) + '</p>' + body + '</article>' +
        '<aside class="aside"><div class="aside-box"><h3>Related</h3><div class="related-list">' + related + '</div></div>' +
        (sources ? '<div class="aside-box source-box"><h3>Resources / External links</h3><div class="source-list">' + sources + '</div></div>' : '') +
        (papers ? '<div class="aside-box paper-box"><h3>Key papers</h3><div class="paper-list">' + papers + '</div></div>' : '') +
        '</aside></div></div>';
      window.scrollTo(0, 0);
    }

    function handleRoute() {
      const raw = window.location.hash.replace(/^#/, "");
      const parts = raw.split("/");
      if (!raw || raw === "home") return renderHome();
      if (parts[0] === "section") return renderSection(parts[1]);
      if (parts[0] === "article") return renderArticle(parts[1]);
      if (parts[0] === "search") return renderSearch(decodeURIComponent(parts.slice(1).join("/")));
      renderHome();
    }

    document.addEventListener("click", function (e) {
      const home = e.target.closest("[data-route='home']");
      const section = e.target.closest("[data-section]");
      const article = e.target.closest("[data-article]");
      const filter = e.target.closest("[data-filter]");
      if (home) route("home");
      else if (article) route("article/" + article.dataset.article);
      else if (section) route("section/" + section.dataset.section);
      else if (filter) { activeFilter = filter.dataset.filter; const q = decodeURIComponent(window.location.hash.split("/").slice(1).join("/")); renderSearch(q); }
    });

    document.getElementById("topSearchForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const q = topSearch.value.trim();
      if (q) { activeFilter = "all"; route("search/" + encodeURIComponent(q)); }
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "/" && document.activeElement.tagName !== "INPUT") {
        e.preventDefault(); topSearch.focus();
      }
    });
    window.addEventListener("hashchange", handleRoute);
    handleRoute();
  </script>
<script src="../../../assets/js/feedback.js"></script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<link rel="icon" href="../assets/img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/img/favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/img/apple-touch-icon.png">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="HaLab Wiki 용어집: 용어 카드의 한 줄 요약, 본문 점선 용어의 정의, 약어 풀이를 모아 용어마다 다루는 페이지로 연결">
<title>용어집 · HaLab Wiki</title>
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/hub.css">
<link rel="stylesheet" href="./glossary.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand-group"><a class="brand brand-home" href="../index.html"><img class="mark" src="../assets/img/symbol.png" alt="">HaLab Wiki</a><span class="brand brand-domain">/ 용어집</span></div>
    <nav class="domain-nav" aria-label="도메인">
      <a href="../gwas/index.html">GWAS</a>
      <a href="../omics/index.html">Omics</a>
      <a href="../single-cell/index.html">Single-cell</a>
      <a href="../multi-omics/index.html">Multi-omics</a>
      <a href="../disease/index.html">Diseases</a>
    </nav>
    <a class="lab-link" href="https://halab.knu.ac.kr" target="_blank" rel="noopener">HaLab ↗</a>
  </div>
</header>

<section class="hub-hero gloss-hero">
  <div class="container">
    <p class="eyebrow">Glossary</p>
    <h1>용어집</h1>
    <p class="lead">용어 카드의 한 줄 요약, 본문 점선 용어의 정의, 약어 풀이를 한곳에 모은 목록. 용어마다 자세히 다루는 페이지로 연결됨.</p>
    <div class="search-wrap">
      <form class="search-box" id="searchForm" role="search" autocomplete="off">
        <input id="q" type="search" aria-label="용어 찾기" placeholder="전체 용어에서 찾기(예: coloc, PRS, eGFR)">
        <button class="clear-btn" id="clearBtn" type="button" aria-label="검색어 지우기">✕</button>
        <span class="keycap">/</span>
      </form>
      <p class="search-hint" id="hint">용어집을 불러오는 중</p>
    </div>
  </div>
</section>

<main class="container hub-main gloss-main">
  <div class="chips" id="chips" role="group" aria-label="도메인 거르기"></div>
  <nav class="az" id="az" aria-label="글자 고르기"></nav>
  <div id="list" aria-live="polite"></div>
</main>

<footer><div class="container"><span>HaLab · Genomic Medicine Lab, Kyungpook National University</span><span id="updated">Updated</span></div></footer>
<script src="./data.js"></script>
<script>
(function () {
  "use strict";
  var G = window.WIKI_GLOSSARY;
  var input = document.getElementById("q"), form = document.getElementById("searchForm");
  var clearBtn = document.getElementById("clearBtn"), hint = document.getElementById("hint");
  var chipsBox = document.getElementById("chips"), az = document.getElementById("az"), list = document.getElementById("list");
  if (!G) {
    hint.textContent = "용어집 데이터를 불러오지 못함 (node tools/build-search-index.js 로 glossary/data.js 생성)";
    input.disabled = true;
    return;
  }
  document.getElementById("updated").textContent = "Updated " + G.updated;

  var COLOR = {}, ORDER = G.domains.map(function (d) { COLOR[d.label] = d.color; return d.label; });
  var LETTERS = "#ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  var LETTER_NAME = { "#": "0–9", "~": "기타" };
  var collator = new Intl.Collator("en", { sensitivity: "base", numeric: true });
  function norm(s) { return String(s).toLowerCase().replace(/[-\s]+/g, " ").trim(); }
  function lead(s) { return String(s).replace(/^[^A-Za-z0-9ㄱ-ㆎ가-힣]+/, ""); }
  function groupOf(s) { var c = lead(s).charAt(0).toUpperCase(); return /[A-Z]/.test(c) ? c : /[0-9]/.test(c) ? "#" : null; }

  var BY_ID = {}, HEAD = {};
  G.entries.forEach(function (e) {
    BY_ID[e.id] = e; HEAD[norm(e.t)] = e;
    var defs = [].concat((e.c || []).map(function (c) { return c.s; }), (e.x || []).map(function (x) { return x.x; }), (e.b || []).map(function (b) { return b.x; }));
    e._t = e.t.toLowerCase();
    e._a = (e.a || []).map(function (s) { return s.toLowerCase(); });
    e._k = (e.k || []).join(" · ").toLowerCase();
    e._s = defs.join(" ").toLowerCase();
  });

  /* 다른 글자로 시작하는 별칭은 그 글자 쪽에 한 줄 바로가기(SNP → Genetic variant & SNP).
     글자 페이지 안에서 Ctrl+F로 찾아도 걸리게 */
  var STUBS = {};
  G.entries.forEach(function (e) {
    (e.a || []).forEach(function (a) {
      var g = groupOf(a), k = norm(a);
      if (!g || g === e.i || HEAD[k]) return;
      if (!STUBS[k]) STUBS[k] = { stub: true, t: a, i: g, to: [], d: [] };
      if (STUBS[k].to.indexOf(e) < 0) STUBS[k].to.push(e);
      e.d.forEach(function (d) { if (STUBS[k].d.indexOf(d) < 0) STUBS[k].d.push(d); });
    });
  });
  STUBS = Object.keys(STUBS).map(function (k) { return STUBS[k]; });

  hint.textContent = "용어 " + G.entries.length + "개를 첫 글자별로 나눔. 글자 안에서는 Ctrl+F, 전체에서 찾을 때는 이 검색창. 정의마다 앞에 나오는 곳을 달았음";

  var filter = "all", view = null;

  function esc(v) {
    return String(v).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; });
  }
  function href(u) { return /^https?:/.test(u) ? u : "../" + u; }
  function inFilter(x) { return filter === "all" || x.d.indexOf(filter) > -1; }

  function score(e, tokens) {
    var whole = tokens.join(" "), total = 0;
    for (var i = 0; i < tokens.length; i++) {
      var tk = tokens[i], s = 0;
      if (e._t === whole) s = 200;
      else if (e._t.indexOf(tk) === 0) s = 80;
      else if (e._t.indexOf(tk) > -1) s = 55;
      if (e._a.indexOf(whole) > -1) s = Math.max(s, 90);
      else if (e._a.some(function (a) { return a.indexOf(tk) > -1; })) s = Math.max(s, 45);
      if (e._k.indexOf(tk) > -1) s = Math.max(s, 25);
      if (e._s.indexOf(tk) > -1) s = Math.max(s, 12);
      if (!s) return 0;
      total += s;
    }
    return total;
  }

  /* 한 줄 = 앞에 출처(어디서 나오는지) + 뒤에 정의. 출처 이름은 그 페이지로 가는 링크.
     같은 출처 이름(면역학 한 섹션의 여러 문서)은 하나로 묶고 첫 문서로 연결, 나머지 제목은 title로 */
  function from(w) {
    var seen = {}, out = [];
    w.forEach(function (p) {
      var s = p.s || p.t;
      if (seen[s]) { seen[s].titles.push(p.t); return; }
      seen[s] = { s: s, u: p.u, d: p.d, titles: [p.t] };
      out.push(seen[s]);
    });
    return out.map(function (o) {
      return '<a href="' + esc(href(o.u)) + '" style="--accent:' + (COLOR[o.d] || "var(--theme)") + '" title="' + esc(o.titles.join(" / ")) + '">' + esc(o.s) + "</a>";
    }).join(" · ");
  }
  function row(cls, label, body) {
    return '<div class="row' + (cls ? " " + cls : "") + '"><span class="from">' + label + '</span><span class="def">' + body + "</span></div>";
  }
  function entryHtml(e) {
    var h = '<article class="term" id="g-' + esc(e.id) + '">';
    h += '<h3><a href="#g-' + esc(e.id) + '">' + esc(e.t) + "</a></h3>";
    if (e.a) h += '<p class="aka">' + esc(e.a.join(" · ")) + "</p>";
    h += '<div class="rows">';
    (e.c || []).forEach(function (c) {
      var t = "용어 카드: " + [c.p, c.g, c.ct].filter(Boolean).join(" › ");
      h += row("", from([{ s: c.l || c.p, u: c.u, d: c.d, t: t }]), esc(c.s || c.ct || "") + ' <a class="go" href="' + esc(href(c.u)) + '">카드 →</a>');
    });
    (e.x || []).forEach(function (x) { h += row("", from(x.w), esc(x.x)); });
    (e.b || []).forEach(function (b) { h += row("", from(b.w), '<span class="kind">약어</span>' + esc(b.x)); });
    if (e.f) h += row("more", "그림으로 보기", e.f.map(function (f) { return '<a href="' + esc(href(f.u)) + '">' + esc(f.t) + "</a>"; }).join(" · "));
    if (e.r) {
      var rel = e.r.map(function (id) { return BY_ID[id]; }).filter(Boolean);
      if (rel.length) h += row("more", "관련 용어", rel.map(function (r) { return '<a href="#g-' + esc(r.id) + '">' + esc(r.t) + "</a>"; }).join(" · "));
    }
    if (e.o) {
      /* 페이지 이름은 괄호 속 약칭만(Rheumatoid Arthritis (RA) → RA) */
      h += row("more", "다루는 문서", e.o.map(function (o) {
        var p = o.p && o.p !== o.t ? ((o.p.match(/\(([^()]+)\)\s*$/) || [])[1] || o.p) : "";
        return (p ? '<span class="n">' + esc(p) + "</span> " : "") + '<a href="' + esc(href(o.u)) + '">' + esc(o.t) + "</a>";
      }).join(" · ") + (e.on ? ' <span class="n">외 ' + (e.on - e.o.length) + "개</span>" : ""));
    }
    return h + "</div></article>";
  }
  function stubHtml(s) {
    return '<p class="see"><b>' + esc(s.t) + "</b> → " + s.to.map(function (e) {
      return '<a href="#g-' + esc(e.id) + '">' + esc(e.t) + "</a>";
    }).join(" · ") + "</p>";
  }

  function renderChips(pool) {
    var counts = {};
    pool.forEach(function (e) { e.d.forEach(function (d) { counts[d] = (counts[d] || 0) + 1; }); });
    chipsBox.innerHTML = '<button class="chip' + (filter === "all" ? " active" : "") + '" data-f="all">전체<span class="n">' + pool.length + "</span></button>" +
      ORDER.filter(function (l) { return counts[l]; }).map(function (l) {
        return '<button class="chip' + (filter === l ? " active" : "") + '" data-f="' + esc(l) + '">' + esc(l) + '<span class="n">' + counts[l] + "</span></button>";
      }).join("");
  }
  function renderAz(counts, active) {
    az.innerHTML = LETTERS.map(function (l) {
      var n = counts[l] || 0;
      return n ? '<a href="#l-' + encodeURIComponent(l) + '" data-l="' + esc(l) + '"' + (l === active ? ' class="on" aria-current="true"' : "") + ">" + esc(LETTER_NAME[l] || l) + "</a>"
               : '<span class="off">' + esc(LETTER_NAME[l] || l) + "</span>";
    }).join("");
    /* 좁은 화면에서 고른 글자가 줄 밖에 있으면 가운데로(가로만 — 페이지는 움직이지 않음) */
    var on = az.querySelector(".on");
    if (on && az.scrollWidth > az.clientWidth) az.scrollLeft = on.offsetLeft - az.clientWidth / 2 + on.offsetWidth / 2;
  }

  function render() {
    var q = input.value.trim().toLowerCase();
    clearBtn.style.display = q ? "block" : "none";
    var tokens = q.split(/\s+/).filter(Boolean);

    /* 검색어가 있으면 글자와 상관없이 전체에서 */
    if (tokens.length) {
      var hits = [];
      G.entries.forEach(function (e) { var s = score(e, tokens); if (s) hits.push({ e: e, s: s }); });
      hits.sort(function (a, b) { return b.s - a.s || a.e.t.length - b.e.t.length; });
      hits = hits.map(function (o) { return o.e; });
      renderChips(hits);
      var shown = hits.filter(inFilter), counts = {};
      G.entries.filter(inFilter).forEach(function (e) { counts[e.i] = (counts[e.i] || 0) + 1; });
      renderAz(counts, null);
      list.innerHTML = shown.length
        ? '<p class="result-meta">전체에서 ' + shown.length + "개" + (filter === "all" ? "" : " · " + esc(filter)) + "</p>" + shown.map(entryHtml).join("")
        : '<div class="empty gloss-empty"><b>“' + esc(input.value.trim()) + '”</b>에 맞는 용어 없음. ' +
          '<a href="../index.html?q=' + encodeURIComponent(input.value.trim()) + '">위키 전체 검색에서 찾기 →</a></div>';
      return;
    }

    /* 검색어가 없으면 고른 글자 하나만 */
    renderChips(G.entries);
    var pool = G.entries.filter(inFilter), stubs = STUBS.filter(inFilter), cnt = {};
    pool.forEach(function (e) { cnt[e.i] = (cnt[e.i] || 0) + 1; });
    var avail = LETTERS.filter(function (l) { return cnt[l]; });
    if (!avail.length) { renderAz(cnt, null); list.innerHTML = '<div class="empty gloss-empty">이 도메인에는 용어 없음.</div>'; return; }
    if (!cnt[view]) view = avail.indexOf("A") > -1 ? "A" : avail[0];
    renderAz(cnt, view);

    var items = pool.filter(function (e) { return e.i === view; })
      .concat(stubs.filter(function (s) { return s.i === view && s.to.some(function (e) { return inFilter(e); }); }));
    items.sort(function (a, b) { return collator.compare(lead(a.t), lead(b.t)); });
    var k = avail.indexOf(view), prev = avail[k - 1], next = avail[k + 1];
    var nTerm = items.filter(function (x) { return !x.stub; }).length, nStub = items.length - nTerm;
    list.innerHTML = '<section class="letter"><h2>' + esc(LETTER_NAME[view] || view) +
      '<small>용어 ' + nTerm + (nStub ? " · 바로가기 " + nStub : "") + "</small></h2>" +
      items.map(function (x) { return x.stub ? stubHtml(x) : entryHtml(x); }).join("") +
      '<nav class="pager" aria-label="앞뒤 글자">' +
      (prev ? '<a href="#l-' + encodeURIComponent(prev) + '" data-l="' + esc(prev) + '">← ' + esc(LETTER_NAME[prev] || prev) + "</a>" : "<span></span>") +
      (next ? '<a href="#l-' + encodeURIComponent(next) + '" data-l="' + esc(next) + '">' + esc(LETTER_NAME[next] || next) + " →</a>" : "<span></span>") +
      "</nav></section>";
  }

  /* 글자를 바꾸면 목록 머리로 — 머리 띠가 보이는 위쪽에 있으면 그대로 둔다 */
  function toListTop() {
    var top = list.getBoundingClientRect().top + window.scrollY - (document.querySelector(".topbar").offsetHeight + az.offsetHeight + 8);
    if (window.scrollY > top) window.scrollTo(0, top);
  }
  function showLetter(l) {
    if (LETTERS.indexOf(l) < 0) return;
    input.value = ""; view = l; render(); toListTop();
  }
  function showEntry(id) {
    var e = BY_ID[id];
    if (!e) return;
    var el = document.getElementById("g-" + id);
    if (!el) { input.value = ""; if (!inFilter(e)) filter = "all"; view = e.i; render(); el = document.getElementById("g-" + id); }
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  }
  function goHash() {
    var h = decodeURIComponent(location.hash.slice(1));
    if (h.indexOf("g-") === 0) showEntry(h.slice(2));
    else if (h.indexOf("l-") === 0) showLetter(h.slice(2));
  }

  var timer;
  input.addEventListener("input", function () { clearTimeout(timer); timer = setTimeout(render, 90); });
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var first = list.querySelector(".term");
    if (first) first.scrollIntoView({ block: "start" });
  });
  clearBtn.addEventListener("click", function () { input.value = ""; render(); input.focus(); });
  chipsBox.addEventListener("click", function (e) {
    var c = e.target.closest("[data-f]");
    if (!c) return;
    filter = c.dataset.f; render();
  });
  /* 같은 글자를 다시 눌러도(주소가 그대로라 hashchange가 없음) 그 글자로 */
  document.addEventListener("click", function (e) {
    var a = e.target.closest("a[data-l]");
    if (a && location.hash === a.getAttribute("href")) { e.preventDefault(); showLetter(a.dataset.l); }
  });
  input.addEventListener("keydown", function (e) { if (e.key === "Escape") { input.value = ""; render(); } });
  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement !== input) { e.preventDefault(); input.focus(); }
  });
  window.addEventListener("hashchange", goHash);

  var pre = new URLSearchParams(location.search).get("q");
  if (pre) input.value = pre;
  render();
  if (location.hash) goHash();
})();
</script>
</body></html>
